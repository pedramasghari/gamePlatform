map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    client_max_body_size 100M;

    # =========================================
    # Frontend (Main Next.js)
    # =========================================
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # =========================================
    # Backend API
    # =========================================
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # =========================================
    # Main Socket.IO
    # =========================================
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================
    # Uploads
    # =========================================
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # HOKM PLUGIN
    # =========================================
    # Hokm frontend
    location /plugins/hokm/ {
        proxy_pass http://hokm-frontend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # =========================================
    # HOKM SOCKET (optional but cleaner)
    # =========================================
    location /plugins/hokm/socket.io/ {
        proxy_pass http://hokm-backend:4001/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================
    # Future Plugins Example
    # =========================================

    # location /plugins/chess/ {
    #     proxy_pass http://chess-frontend/;
    # }

    # location /plugins/chess/socket.io/ {
    #     proxy_pass http://chess-backend:4002/socket.io/;
    # }

}
