version: "3.9"

services:
  # =========================================
  # NGINX
  # =========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - game-network
  postgres: 
    image: postgres:16 
    container_name: game-postgres 
    restart: always 
    environment: 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: gameplatform 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game-network

  # =========================================
  # FRONTEND (Next.js)
  # =========================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: /socket.io
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - game-network

  # =========================================
  # BACKEND (NestJS)
  # =========================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: 8sdf7sdf8sdf7sdf8sdf7sdf

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: gameplatform

      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
      LIVEKIT_URL: ws://livekit:7880
    expose:
      - "3001"
    depends_on:
      - redis
      - kafka
      - livekit
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    networks:
      - game-network

  # =========================================
  # REDIS
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - game-network

  # =========================================
  # LIVEKIT
  # =========================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: --config /etc/livekit/config.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit/config.yaml:/etc/livekit/config.yaml:ro
    environment:
      LIVEKIT_LOG_LEVEL: info
    networks:
      - game-network

  # =========================================
  # KAFKA (KRaft mode)
  # =========================================
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - game-network


volumes:
  redis_data:
  kafka_data:
  postgres_data:

networks:
  game-network:
    name: game-network
