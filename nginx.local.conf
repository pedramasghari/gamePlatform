map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    client_max_body_size 100M;


    # =========================================
    # HOKM PLUGIN
    # =========================================
    # Hokm frontend
    location /plugins/hokm/ {
        proxy_pass http://host.docker.internal:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # =========================================
    # HOKM SOCKET (optional but cleaner)
    # =========================================
    location /plugins/hokm/socket.io/ {
        proxy_pass http://host.docker.internal:4001/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================
    # Future Plugins Example
    # =========================================

    # location /plugins/chess/ {
    #     proxy_pass http://chess-frontend/;
    # }

    # location /plugins/chess/socket.io/ {
    #     proxy_pass http://chess-backend:4002/socket.io/;
    # }

}
